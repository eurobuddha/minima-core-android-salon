plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.salon'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.salon"
        minSdk 28
        targetSdk 35
        versionCode 1110
        versionName "0.11.10"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo). On a machine without those props this stays empty and
        // release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 shrink-only is STAGED (keep rules in proguard-rules.pro cover
            // JNA/lazysodium/jsch/zxing) and builds clean at 7MB vs 16MB — flip both flags
            // to true once the lazysodium crypto path (DMs/messaging key) is runtime-verified
            // on a family-key device. Held off so 0.10.0 ships the smoke-tested (non-R8) build.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release   // Minima family release key
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        // jsch and jspecify both ship this OSGi metadata; neither is needed at runtime
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation files('libs/minimaapi.aar')
    implementation 'com.caverock:androidsvg-aar:1.4'

    // SFTP for the Hosting feature — maintained JSch fork (modern KEX for
    // current OpenSSH; stock jcraft 0.1.55 cannot connect to Debian 12+)
    implementation 'com.github.mwiede:jsch:0.2.21'

    // libsodium for the Encrypted-relay hosting backend (crypto_secretbox) —
    // same versions the comms code (support/freezepeach) uses.
    implementation 'com.goterl:lazysodium-android:5.1.0@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // QR codes (tip address / profile URL for in-person scanning) — pure-Java, no Android deps.
    implementation 'com.google.zxing:core:3.5.3'

    // pull-to-refresh on Feed / Discover
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // windowed/recycled list for the profile's Posts section (bounded memory as it grows)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
